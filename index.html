<html lang="tr">
<head>

<script>try{var t=localStorage.getItem("pk-tema");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<title>PaKdiL AI · Eğitim Alanı</title>
<style>
:root{--bg:#0a0a0c;--s1:#131317;--s2:#1b1b21;--line:#2a2a33;--tx:#f4f1ea;--mut:#a09da8;--gold:#d4af6a;--gold2:#a9854a;--red:#c8102e;--c1:#16161b;--c2:#0f0f13;--inp:#0a0a0d;--topbg:rgba(10,10,12,.88);--sh:#fff3c4}
:root[data-theme=light]{--bg:#f6f1e7;--s1:#fff;--s2:#f0e9d9;--line:#e1d7c0;--tx:#1d1a14;--mut:#6b6556;--gold:#9a7424;--gold2:#8a6420;--c1:#fff;--c2:#fbf7ee;--inp:#faf6ec;--topbg:rgba(246,241,231,.9);--sh:#c9962f}
[data-theme=light] .it.done .ic{color:#fff}[data-theme=light] .b.wa{border-color:#168a45;color:#168a45}[data-theme=light] .msg{color:#c0182f}[data-theme=light] .b.outb{color:#c0182f}[data-theme=light] .card,[data-theme=light] .pkw{box-shadow:0 10px 40px rgba(120,90,30,.12)}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100dvh;line-height:1.6;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 420px at 85% -5%,rgba(200,16,46,.2),transparent),repeating-linear-gradient(115deg,transparent 0 46px,rgba(212,175,106,.06) 46px 47px);-webkit-mask:linear-gradient(#000 40%,transparent);mask:linear-gradient(#000 40%,transparent)}
button,input{font:inherit}a{color:var(--gold)}[hidden]{display:none!important}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:1px solid var(--line);background:var(--s2);color:var(--tx);padding:10px 18px;border-radius:12px;cursor:pointer;text-decoration:none;font-size:.92rem;transition:.2s}
.b:hover{border-color:var(--gold);color:var(--gold)}
.b.g{background:linear-gradient(135deg,#e6c984,#c29a4c);color:#1a1306;border:0;font-weight:700}.b.g:hover{filter:brightness(1.08);color:#1a1306}
.b.home{border-color:rgba(212,175,106,.55);color:var(--gold);background:rgba(212,175,106,.1)}.b.home:hover{background:rgba(212,175,106,.2)}
.b.outb{border-color:rgba(200,16,46,.6);color:#ff6b80;background:rgba(200,16,46,.1)}.b.outb:hover{background:rgba(200,16,46,.2);color:#ff8a9a}
.lgw{width:min(100%,440px);display:flex;flex-direction:column;align-items:center;gap:16px}.lgw .frame{width:100%}
.thm{flex:none;width:48px;height:48px;display:grid;place-items:center;background:none;border:0;padding:0;color:var(--gold);cursor:pointer;border-radius:50%;-webkit-tap-highlight-color:transparent}
.thm:hover{color:var(--tx)}.thm svg{width:28px;height:28px;overflow:visible}
.thm .sun,.thm .beams{transform-origin:center;transform-box:fill-box}
.thm .sun{transition:transform .5s cubic-bezier(.5,1.25,.75,1.25)}.thm .beams{transition:transform .5s cubic-bezier(.5,1.5,.75,1.25),opacity .3s}
.thm .mc{transition:transform .4s ease-out}
:root:not([data-theme=light]) .thm .sun{transform:scale(1.7)}
:root:not([data-theme=light]) .thm .beams{transform:rotate(-25deg) scale(.4);opacity:0}
:root:not([data-theme=light]) .thm .mc{transform:translate(-7px,-3px)}
@media(prefers-reduced-motion:reduce){.thm *{transition:none!important}}
.screen[data-play]{position:relative;cursor:pointer;background-size:cover;background-position:center}
.playb{width:78px;height:78px;border-radius:50%;border:0;background:linear-gradient(135deg,#e6c984,#c29a4c);color:#1a1306;font-size:1.8rem;padding-left:5px;box-shadow:0 10px 34px rgba(0,0,0,.55);pointer-events:none;transition:.2s}
.screen[data-play]:hover .playb{transform:scale(1.07)}
.pl{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#fff;font-size:.82rem;opacity:.85;text-shadow:0 1px 6px #000}
.b.wa{border-color:#25d366;color:#7ee2a0}
/* açılış / giriş */
.splash,.lg{position:relative;min-height:100dvh;display:grid;place-items:center;padding:28px 18px}
.ring{width:54px;height:54px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:sp 1s linear infinite;margin:0 auto 18px}
@keyframes sp{to{transform:rotate(360deg)}}
.splash p{color:var(--mut);text-align:center;letter-spacing:.5px}
.frame{position:relative;width:min(100%,440px);border-radius:24px;padding:2px;background:linear-gradient(145deg,rgba(212,175,106,.7),rgba(212,175,106,.12) 40%,rgba(212,175,106,.55));box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 60px rgba(212,175,106,.08)}
.frame::after{content:"";position:absolute;inset:0;border-radius:24px;padding:2.5px;background:linear-gradient(105deg,transparent 38%,var(--sh) 50%,transparent 62%) 160% 0/250% 100% no-repeat;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:shine 4.5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%{background-position:160% 0}55%,100%{background-position:-60% 0}}
.card{background:linear-gradient(180deg,var(--c1),var(--c2));border-radius:22px;padding:44px 32px 34px}
.logo{text-align:center;font-size:1.7rem;font-weight:800;letter-spacing:.5px}.logo b{color:var(--red)}
.tag{text-align:center;color:var(--gold);font-size:.72rem;letter-spacing:3px;text-transform:uppercase;margin:4px 0 6px}
.ln{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px 0 24px}
.card p.s{color:var(--mut);text-align:center;font-size:.95rem;margin-bottom:22px}
.card input{width:100%;min-height:54px;padding:14px 16px;margin-bottom:14px;background:var(--inp);border:1px solid var(--line);border-radius:14px;color:var(--tx);font-size:16px}
.card input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,106,.12)}
.card .b.g{width:100%;min-height:54px;font-size:1rem;margin-top:6px}
.msg{color:#ff8a9a;min-height:22px;font-size:.88rem;text-align:center;margin-top:12px}
.lk{text-align:center;color:var(--mut);font-size:.88rem;margin-top:18px}
/* uygulama */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 22px;background:var(--topbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font-weight:800}.brand b{color:var(--red)}.brand small{display:block;color:var(--gold);font-weight:600;font-size:.66rem;letter-spacing:2px;text-transform:uppercase}
.sp{flex:1}
.wrap{position:relative;max-width:1180px;margin:0 auto;padding:40px 22px 80px}
.hero h1{font-size:clamp(1.7rem,5vw,2.6rem);line-height:1.2}.hero h1 span{color:var(--gold)}
.hero p{color:var(--mut);margin-top:8px}
.cont{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));transition:.4s}
.stage{background:var(--s1);border:1px solid rgba(212,175,106,.28);border-radius:20px;overflow:hidden}
.screen{aspect-ratio:16/9;background:#000;display:grid;place-items:center;color:var(--mut)}
.screen iframe,.screen video{width:100%;height:100%;border:0;background:#000}
.info{padding:20px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.info h2{flex:1;font-size:1.15rem;min-width:200px}
.sec{padding:16px 12px 6px;color:var(--gold);font-size:.74rem;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.it{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:13px 12px;border-radius:14px;cursor:pointer;min-height:56px}
.it:hover{background:var(--s2)}.it.on{background:var(--s2);box-shadow:inset 3px 0 var(--red)}
.ic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line)}
.it.done .ic{background:var(--gold);color:#1a1306;border:0}
.it span{flex:1;font-size:.95rem}.it small{color:var(--mut)}
.nw{background:var(--red);color:#fff;font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:1px}
.pdf{text-align:center;padding:30px 20px}.pdf .big{font-size:3.2rem}
.empty{text-align:center;color:var(--mut);padding:70px 22px;border:1px dashed var(--line);border-radius:20px;margin-top:30px}
.help{margin-top:34px;text-align:center}
.rg{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(26,19,6,.25);border-top-color:#1a1306;animation:sp .8s linear infinite}
.b.ld{pointer-events:none}
.gf{position:relative}
.gf::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:linear-gradient(105deg,transparent 38%,var(--sh) 50%,transparent 62%) 160% 0/250% 100% no-repeat;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:shine 10s ease-in-out infinite;animation-delay:var(--d,0s);pointer-events:none}
.pkw{margin-bottom:20px;border-radius:22px;background:linear-gradient(180deg,var(--c1),var(--c2));border:1px solid rgba(212,175,106,.28)}
.pkc{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:0;cursor:pointer;border-radius:22px}
.pbar{display:flex;gap:14px;align-items:center;padding:18px 20px}
.pimg img{display:block;width:100%;height:auto;border-radius:22px 22px 0 0}.pimg .ph{height:150px;border-radius:22px 22px 0 0;background:var(--s2);display:grid;place-items:center;font-size:3rem;color:var(--gold)}
.pkc .tx{flex:1;min-width:0}.pkc strong{display:block;line-height:1.35;font-size:1.12rem;word-break:break-word}.pkc small{color:var(--mut)}
.chev{flex:none;display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:linear-gradient(135deg,#e6c984,#c29a4c);color:#1a1306;font-weight:700;font-size:.88rem;box-shadow:0 4px 16px rgba(212,175,106,.35)}.chev i{font-style:normal;font-size:1.1rem;transition:.25s}.pkw.open .chev i{transform:rotate(180deg)}
.pn{padding:4px 18px 22px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}
.cols.one{grid-template-columns:1fr}
.grp h3{font-size:.8rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold);padding:0 6px 8px;border-bottom:1px solid var(--line)}
.grp h3 small{color:var(--mut);letter-spacing:0}
.pn .it{text-decoration:none}
@media(max-width:860px){.cols{grid-template-columns:1fr}.top{padding:12px 16px}.wrap{padding:30px 16px 70px}.card{padding:40px 24px 30px}.pbar{padding:14px;flex-wrap:wrap}.chev{width:100%;justify-content:center}.pn{padding:2px 12px 18px}.info .b{width:100%}.cont .b{flex:1}.top .b{padding:10px 14px}}
#vApp{min-height:100dvh;display:flex;flex-direction:column}#vApp .wrap{flex:1;width:100%}
.ftr{position:relative;flex:none;height:240px;margin-top:10px;overflow:hidden}
.ftr canvas{position:absolute;inset:0;width:100%;height:100%;-webkit-mask:linear-gradient(transparent,#000 45%);mask:linear-gradient(transparent,#000 45%)}
.ft-tx{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));text-align:center;z-index:2}
.ft-tx span{color:var(--gold);font-size:.8rem;letter-spacing:.4px}
</style>
</head>
<body>
<div id="vLogin" class="lg"><div class="lgw">
  <div class="frame"><div class="card">
    <div class="logo">PaKdiL <b>AI</b></div><div class="tag">Eğitim Alanı</div><div class="ln"></div>
    <p class="s">Ana sitedeki kullanıcı adın veya e-postanla giriş yap.</p>
    <input id="u" placeholder="Kullanıcı adı veya e-posta" autocomplete="username" autocapitalize="none" autocorrect="off">
    <input id="p" type="password" placeholder="Şifre" autocomplete="current-password">
    <button class="b g" id="go">Giriş yap</button>
    <div class="msg" id="msg"></div>
    <div class="lk">Hesabın yok mu? <a href="https://pakdil-arapca.github.io/pakdil.arapca/">Ana siteden</a> paketini al.</div>
  </div></div>
  <button class="thm" aria-label="Aydınlık / karanlık tema" title="Tema"></button>
</div></div>

<div id="vApp" hidden>
  <header class="top">
    <div class="brand">PaKdiL <b>AI</b><small>Eğitim Alanı</small></div><div class="sp"></div>
    <button class="thm" aria-label="Aydınlık / karanlık tema" title="Tema"></button>
    <a class="b home" href="https://pakdil-arapca.github.io/pakdil.arapca/">Ana site</a>
    <button class="b outb" id="out">Çıkış</button>
  </header>
  <main class="wrap">
    <div class="hero"><h1>Hoş geldin<span id="nm"></span></h1><p id="sub"></p></div>
    <div class="pks" id="pk"></div>
    <div id="body"></div>
    <div class="help" id="help"></div>
  </main>
  <footer class="ftr"><canvas id="fx" aria-hidden="true"></canvas><div class="ft-tx"><span>© PaKdiL AI. Tüm hakları saklıdır.</span></div></footer>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,query,where,getDocs} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCGoResXYR7G_Eleo7uAPGtwi4lfMK7j0U",authDomain:"pakdil-arapca.firebaseapp.com",projectId:"pakdil-arapca",storageBucket:"pakdil-arapca.firebasestorage.app",messagingSenderId:"742864186684",appId:"1:742864186684:web:3139c7b7219d81992b8239"});
const auth=getAuth(app),db=getFirestore(app);auth.languageCode='tr';
const $=s=>document.querySelector(s);
const setTheme=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem('pk-tema',t)}catch(e){}document.querySelector('meta[name=theme-color]').content=t==='light'?'#f6f1e7':'#0a0a0c'};
document.querySelectorAll('.thm').forEach((b,n)=>{b.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true"><mask id="mk${n}"><rect x="-4" y="-4" width="32" height="32" fill="#fff"/><circle class="mc" cx="24" cy="10" r="6" fill="#000"/></mask><circle class="sun" cx="12" cy="12" r="6" mask="url(#mk${n})" fill="currentColor"/><g class="beams" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></g></svg>`});
document.querySelectorAll('.thm').forEach(b=>b.onclick=()=>setTheme(document.documentElement.dataset.theme==='light'?'dark':'light'));
setTheme(document.documentElement.dataset.theme==='light'?'light':'dark');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hs=s=>{let x=5381;for(const c of s)x=((x*33)^c.charCodeAt(0))>>>0;return x.toString(36)};
let lastP='',lastD='',uid='',pkgs=[],cur=null,sel=null,done=new Set(),seen=new Set(),wa='';
const kk=(p,i)=>hs(p.id+'|'+i.u);

/* ilerleme: hesapta (users/{uid}) + bu cihazda yedek */
const lsKey=()=>'pk-ilerleme2-'+uid;
function save(){
  const v={done:[...done],seen:[...seen],son:cur||'',sd:sel||''};
  try{localStorage.setItem(lsKey(),JSON.stringify(v))}catch(e){}
  setDoc(doc(db,'users',uid),{egitimIlerleme:v},{merge:true}).catch(()=>{});
}

function parse(txt){
  const out=[];let sec='';
  String(txt||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    if(l[0]==='#'){sec=l.replace(/^#+\s*/,'');return}
    let t='',u=l;const i=l.lastIndexOf('|');
    if(i>-1){t=l.slice(0,i).trim();u=l.slice(i+1).trim()}
    if(!/^https?:\/\//i.test(u))return;
    const n=out.length+1;
    const yt=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
    const tur=yt?'yt':/\.(mp4|webm|mov)(\?|$)|firebasestorage|storage\.googleapis/i.test(u)?'video':'pdf';
    out.push({id:'d'+n,t:t||'Ders '+n,u,tur,yt:yt&&yt[1],sec});
  });
  return out;
}

async function girisEmail(v){
  if(v.includes('@'))return v;
  const d=await getDoc(doc(db,'usernames',v.toLowerCase()));
  if(!d.exists())throw {code:'auth/user-not-found'};
  return d.data().email;
}
$('#go').onclick=async()=>{
  const m=$('#msg'),b=$('#go');m.textContent='';b.disabled=true;
  try{await signInWithEmailAndPassword(auth,await girisEmail($('#u').value.trim()),$('#p').value)}
  catch(e){m.textContent=/network/.test(e.code||'')?'Bağlantı hatası.':'Kullanıcı adı/e-posta veya şifre hatalı.';b.disabled=false}
};
$('#p').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
$('#out').onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
  const b=$('#go');
  if(!u){$('#vApp').hidden=true;$('#vLogin').hidden=false;b.disabled=false;b.classList.remove('ld');b.textContent='Giriş yap';return}
  b.disabled=true;b.classList.add('ld');b.innerHTML='<span class="rg"></span>Giriş yapılıyor…';$('#msg').textContent='';
  const t0=Date.now();
  uid=u.uid;done=new Set();seen=new Set();let first=false;
  try{
    const ud=await getDoc(doc(db,'users',uid));
    const dd=ud.exists()?ud.data():{};
    const ad=dd.ad||dd.adSoyad||'';
    $('#nm').textContent=ad?', '+String(ad).split(' ')[0]:'';
    let pr=dd.egitimIlerleme;
    if(!pr){try{pr=JSON.parse(localStorage.getItem(lsKey())||'null')}catch(e){}}
    if(pr){done=new Set(pr.done||[]);seen=new Set(pr.seen||[]);lastP=pr.son||'';lastD=pr.sd||''}else first=true;
    const s=await getDocs(query(collection(db,'orders'),where('uid','==',uid)));
    const map={};
    s.docs.map(d=>d.data()).filter(o=>o.durum==='onaylandı').forEach(o=>(o.kalemler||[]).forEach(k=>{
      if(!map[k.id]||(!map[k.id].icerik&&k.icerik))map[k.id]=k;
    }));
    pkgs=Object.values(map).map(k=>({id:k.id,baslik:k.baslik,items:parse(k.icerik),img:''}));
    await Promise.all(pkgs.map(async p=>{try{const d=await getDoc(doc(db,'packages',p.id));p.img=((d.data()||{}).gorseller||[])[0]||''}catch(e){}}));
    getDoc(doc(db,'settings','payment')).then(x=>{if(x.exists()){wa=String(x.data().wa||'').replace(/\D/g,'');$('#help').innerHTML=wa?`<a class="b wa" href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp'tan soru sor</a>`:''}}).catch(()=>{});
  }catch(e){pkgs=[];$('#sub').textContent='Veriler okunamadı. Sayfayı yenile.'}
  if(first){pkgs.forEach(p=>p.items.forEach(i=>seen.add(kk(p,i))));save()}
  cur=pkgs.some(p=>p.id===lastP)?lastP:(pkgs.length===1?pkgs[0].id:null);sel=null;
  if(cur){const p=pkgs.find(x=>x.id===cur);sel=vids(p).some(x=>x.id===lastD)?lastD:firstVid(p)}
  await new Promise(r=>setTimeout(r,Math.max(0,1700-(Date.now()-t0))));
  $('#vLogin').hidden=true;$('#vApp').hidden=false;draw();
});

const pct=p=>p.items.length?Math.round(p.items.filter(i=>done.has(kk(p,i))).length/p.items.length*100):0;
const vids=p=>p.items.filter(x=>x.tur!=='pdf'),pdfs=p=>p.items.filter(x=>x.tur==='pdf');
const firstVid=p=>{const v=vids(p);return (v.find(x=>!done.has(kk(p,x)))||v[0]||{}).id||null};
const openPk=(pid,iid)=>{cur=pid;const p=pkgs.find(x=>x.id===pid);sel=iid||firstVid(p);save();draw();setTimeout(()=>{const e=document.querySelector('.pkw.open');e&&e.scrollIntoView({behavior:'smooth',block:'start'})},60)};

function rows(p,arr,isPdf){
  let last='';
  return arr.map(x=>{
    const k=kk(p,x),h=x.sec&&x.sec!==last?`<div class="sec">${esc(x.sec)}</div>`:'';last=x.sec||last;
    const nw=!seen.has(k)&&!done.has(k)?' <span class="nw">YENİ</span>':'';
    const ic=done.has(k)?'✓':isPdf?'📄':'▶';
    const inner=`<div class="ic">${ic}</div><span>${esc(x.t)}${nw}<br><small>${isPdf?'Aç / indir':'Video'}</small></span>`;
    return h+(isPdf?`<a class="it pdfr ${done.has(k)?'done':''}" data-i="${x.id}" href="${esc(x.u)}" target="_blank" rel="noopener noreferrer">${inner}</a>`:`<button class="it ${x.id===sel?'on':''} ${done.has(k)?'done':''}" data-i="${x.id}">${inner}</button>`);
  }).join('');
}

function panel(p){
  const v=vids(p),f=pdfs(p);
  if(!p.items.length)return '<div class="pn"><div class="empty" style="margin-top:6px;padding:40px 16px">Bu paketin dersleri yakında eklenecek.</div></div>';
  const it=v.find(x=>x.id===sel);let stage='';
  if(it){
    const th=it.tur==='yt'?`background-image:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.45)),url(https://i.ytimg.com/vi/${esc(it.yt)}/hqdefault.jpg)`:'';
    const scr=`<div class="screen" data-play="1" style="${th}"><button class="playb" aria-label="Videoyu oynat" tabindex="-1">▶</button><span class="pl">Oynatmak için dokun</span></div>`;
    const dn=done.has(kk(p,it));
    stage=`<div class="stage gf" style="--d:-4s">${scr}<div class="info"><h2>${esc(it.t)}</h2><button class="b ${dn?'':'g'}" id="dn">${dn?'Tamamlandı ✓':'Tamamlandı, sonraki video →'}</button></div></div>`;
  }
  return `<div class="pn">${stage}<div class="cols ${v.length&&f.length?'':'one'}">${v.length?`<div class="grp"><h3>🎬 Videolar <small>(${v.length})</small></h3>${rows(p,v,false)}</div>`:''}${f.length?`<div class="grp"><h3>📄 PDF / Kaynaklar <small>(${f.length})</small></h3>${rows(p,f,true)}</div>`:''}</div></div>`;
}

function draw(){
  if(!pkgs.length){
    $('#pk').innerHTML='';$('#sub').textContent='';
    $('#body').innerHTML='<div class="empty"><p style="font-size:2.4rem">🔒</p><p style="margin:10px 0 18px">Onaylanmış bir paketin yok. Siparişin onaylanınca dersler burada açılır.</p><a class="b g" href="https://pakdil-arapca.github.io/pakdil.arapca/">Ana siteye git</a></div>';
    return;
  }
  $('#body').innerHTML='';
  $('#sub').textContent=pkgs.length+' paketin açık. Bir pakete dokunup içeriğini aç.';
  $('#pk').innerHTML=pkgs.map((p,n)=>`<div class="pkw gf ${p.id===cur?'open':''}" style="--d:${-n*3.3}s"><button class="pkc" data-id="${esc(p.id)}" aria-expanded="${p.id===cur}"><div class="pimg">${p.img?`<img src="${esc(p.img)}" alt="${esc(p.baslik)}" loading="lazy">`:'<div class="ph">ع</div>'}</div><div class="pbar"><div class="tx"><strong>${esc(p.baslik)}</strong><small>${p.items.length} içerik · %${pct(p)} tamamlandı</small><div class="bar"><i style="width:${pct(p)}%"></i></div></div><span class="chev"><span>${p.id===cur?'Kapat':'İçeriği aç'}</span><i>▾</i></span></div></button>${p.id===cur?panel(p):''}</div>`).join('');
  document.querySelectorAll('.pkc').forEach(b=>b.onclick=()=>{if(cur===b.dataset.id){cur=null;sel=null;save();draw()}else openPk(b.dataset.id)});
  const p=pkgs.find(x=>x.id===cur);if(!p)return;
  const v=vids(p),it=v.find(x=>x.id===sel);
  if(it&&!seen.has(kk(p,it))){seen.add(kk(p,it));save()}
  document.querySelectorAll('.it[data-i]:not(.pdfr)').forEach(b=>b.onclick=()=>{sel=b.dataset.i;save();draw()});
  document.querySelectorAll('.pdfr').forEach(a=>a.addEventListener('click',()=>{const x=p.items.find(y=>y.id===a.dataset.i);done.add(kk(p,x));seen.add(kk(p,x));save();setTimeout(draw,50)}));
  const dn=$('#dn');if(dn&&it){
    const nxv=v[v.indexOf(it)+1];
    const finish=()=>{done.add(kk(p,it));if(nxv){sel=nxv.id}save();draw()};
    dn.onclick=()=>{if(done.has(kk(p,it))){done.delete(kk(p,it));save();draw()}else finish()};
    const sc=document.querySelector('.screen[data-play]');
    if(sc)sc.onclick=()=>{sc.removeAttribute('data-play');sc.removeAttribute('style');
      if(it.tur==='yt')sc.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${esc(it.yt)}?rel=0&playsinline=1&autoplay=1" allow="autoplay;accelerometer;encrypted-media;picture-in-picture" allowfullscreen></iframe>`;
      else{sc.innerHTML=`<video controls playsinline autoplay src="${esc(it.u)}"></video>`;sc.firstChild.addEventListener('ended',()=>{if(!done.has(kk(p,it)))finish()})}};
  }
}

/* alt animasyon: akan altın dalgalar + süzülen Arapça harfler */
(function(){
const cv=$('#fx'),ft=$('.ftr'),cx=cv.getContext('2d');
const L='عبتثجحخدذرزسشصضطظغفقكلمنهوي'.split('');
const rnd=(a,b)=>a+Math.random()*(b-a);
let W=0,H=0,ps=[],gold='212,175,106',run=false,last=0;
const mk=init=>({c:L[Math.random()*L.length|0],x:rnd(0,W),y:init?rnd(0,H):H+30,s:rnd(18,38),v:rnd(.25,.6),a:rnd(.16,.36),ph:rnd(0,6.28),dr:rnd(.2,.6)});
const col=()=>{const h=getComputedStyle(document.documentElement).getPropertyValue('--gold').trim().replace('#','');if(h.length===6)gold=[0,2,4].map(i=>parseInt(h.substr(i,2),16)).join(',')};
function size(){const d=Math.min(devicePixelRatio||1,2);W=ft.clientWidth;H=ft.clientHeight;if(!W)return;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);ps=Array.from({length:Math.max(8,Math.round(W/75))},()=>mk(true));draw(0)}
function draw(ts){
  const t=ts/1000;cx.clearRect(0,0,W,H);
  for(let k=0;k<4;k++){
    const base=H*(.58+.09*k),amp=9+5*k,f=.0075-.0011*k,sp=.5+.18*k;
    const g=cx.createLinearGradient(0,0,W,0);g.addColorStop(0,`rgba(${gold},0)`);g.addColorStop(.5,`rgba(${gold},${.5-.08*k})`);g.addColorStop(1,`rgba(${gold},0)`);
    cx.strokeStyle=g;cx.lineWidth=1.3;cx.beginPath();
    for(let x=0;x<=W;x+=6){const y=base+Math.sin(x*f+t*sp+k)*amp+Math.sin(x*f*2.3-t*sp*.7)*amp*.35;x?cx.lineTo(x,y):cx.moveTo(x,y)}
    cx.stroke();
  }
  for(const p of ps){
    p.y-=p.v;p.x+=Math.sin(t*p.dr+p.ph)*.25;
    const life=(H+30-p.y)/(H+60);
    if(life>=1||life<0){Object.assign(p,mk(false));continue}
    cx.font=p.s+'px "Noto Naskh Arabic","Amiri",serif';cx.fillStyle=`rgba(${gold},${p.a*Math.sin(Math.PI*life)})`;cx.fillText(p.c,p.x,p.y);
  }
}
function loop(ts){if(!run)return;requestAnimationFrame(loop);if(ts-last<33)return;last=ts;draw(ts)}
const go=()=>{if(run||document.hidden||matchMedia('(prefers-reduced-motion:reduce)').matches)return;run=true;requestAnimationFrame(loop)};
new IntersectionObserver(e=>{if(e[0].isIntersecting){col();go()}else run=false}).observe(ft);
new ResizeObserver(size).observe(ft);
document.addEventListener('visibilitychange',()=>{if(document.hidden)run=false;else if(ft.clientWidth)go()});
document.querySelectorAll('.thm').forEach(b=>b.addEventListener('click',()=>setTimeout(col,60)));
col();
})();
</script>
</body>
