<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PaKdiL AI · Eğitim Alanı</title>
<style>
:root{--bg:#0a0a0c;--s1:#131317;--s2:#1b1b21;--line:#2a2a33;--tx:#f4f1ea;--mut:#9b98a3;--gold:#d4af6a;--gold2:#a9854a;--red:#c8102e}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1200px 500px at 80% -10%,rgba(200,16,46,.18),transparent),var(--bg);color:var(--tx);min-height:100vh;line-height:1.5}
button,input{font:inherit}
a{color:var(--gold)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(10,10,12,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.5px}.brand b{color:var(--red)}.brand small{display:block;color:var(--gold);font-weight:600;font-size:.7rem;letter-spacing:2px;text-transform:uppercase}
.sp{flex:1}
.b{border:1px solid var(--line);background:var(--s2);color:var(--tx);padding:9px 14px;border-radius:10px;cursor:pointer;text-decoration:none;font-size:.88rem;transition:.2s}
.b:hover{border-color:var(--gold);color:var(--gold)}
.b.g{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1306;border:0;font-weight:700}
.b.g:hover{filter:brightness(1.1);color:#1a1306}
.wrap{max-width:1180px;margin:0 auto;padding:26px 18px 60px}
.login{max-width:400px;margin:9vh auto;padding:34px 28px;background:var(--s1);border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.5);border-top:3px solid var(--gold)}
.login h1{font-size:1.5rem;margin-bottom:4px}.login p{color:var(--mut);font-size:.9rem;margin-bottom:20px}
.login input{width:100%;padding:13px 14px;margin-bottom:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--tx)}
.login input:focus{outline:none;border-color:var(--gold)}
.login .b{width:100%;padding:13px}
.msg{color:#ff7b8d;min-height:20px;font-size:.85rem;margin-top:10px}
.hero h1{font-size:clamp(1.5rem,4vw,2.3rem)}.hero h1 span{color:var(--gold)}
.hero p{color:var(--mut);margin-top:4px}
.pk{display:flex;gap:10px;overflow-x:auto;padding:20px 0 6px}
.pkc{flex:none;min-width:200px;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--tx);cursor:pointer;transition:.2s}
.pkc:hover{border-color:var(--gold2)}
.pkc[aria-pressed=true]{border-color:var(--gold);background:linear-gradient(160deg,var(--s2),var(--s1));box-shadow:0 0 0 1px var(--gold)}
.pkc strong{display:block}.pkc small{color:var(--mut)}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));width:0;transition:.4s}
.grid{display:grid;grid-template-columns:1fr 340px;gap:20px;margin-top:18px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.stage{background:var(--s1);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.screen{aspect-ratio:16/9;background:#000;display:grid;place-items:center;color:var(--mut)}
.screen iframe,.screen video{width:100%;height:100%;border:0;background:#000}
.info{padding:16px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.info h2{flex:1;font-size:1.1rem;min-width:180px}
.list{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:8px;max-height:620px;overflow:auto}
.sec{padding:14px 12px 6px;color:var(--gold);font-size:.74rem;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.it{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:11px 12px;border-radius:12px;cursor:pointer;transition:.15s}
.it:hover{background:var(--s2)}.it.on{background:var(--s2);box-shadow:inset 3px 0 var(--red)}
.ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);font-size:.95rem}
.it.done .ic{background:var(--gold);color:#1a1306;border:0}
.it span{flex:1;font-size:.93rem}.it small{color:var(--mut)}
.pdf{padding:30px 20px;text-align:center}.pdf .big{font-size:3rem}
.empty{text-align:center;color:var(--mut);padding:60px 20px;border:1px dashed var(--line);border-radius:18px;margin-top:24px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="vLogin" class="login" hidden>
  <h1>PaKdiL <span style="color:var(--red)">AI</span> Eğitim Alanı</h1>
  <p>Ana sitedeki kullanıcı adın (veya e-postan) ve şifrenle giriş yap.</p>
  <input id="u" placeholder="Kullanıcı adı veya e-posta" autocomplete="username" autocapitalize="none">
  <input id="p" type="password" placeholder="Şifre" autocomplete="current-password">
  <button class="b g" id="go">Giriş yap</button>
  <div class="msg" id="msg"></div>
  <p style="margin:16px 0 0;font-size:.82rem">Hesabın yok mu? <a href="https://pakdil-arapca.github.io/pakdil.arapca/">Ana siteden</a> kayıt ol ve paketini al.</p>
</div>

<div id="vApp" hidden>
  <header class="top">
    <div class="brand">PaKdiL <b>AI</b><small>Eğitim Alanı</small></div>
    <div class="sp"></div>
    <a class="b" href="https://pakdil-arapca.github.io/pakdil.arapca/">Ana site</a>
    <button class="b" id="out">Çıkış</button>
  </header>
  <main class="wrap">
    <div class="hero"><h1>Hoş geldin<span id="nm"></span></h1><p id="sub"></p></div>
    <div class="pk" id="pk"></div>
    <div id="body"></div>
  </main>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {getFirestore,doc,getDoc,collection,query,where,getDocs} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCGoResXYR7G_Eleo7uAPGtwi4lfMK7j0U",authDomain:"pakdil-arapca.firebaseapp.com",projectId:"pakdil-arapca",storageBucket:"pakdil-arapca.firebasestorage.app",messagingSenderId:"742864186684",appId:"1:742864186684:web:3139c7b7219d81992b8239"});
const auth=getAuth(app),db=getFirestore(app);auth.languageCode='tr';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let uid='',pkgs=[],cur=null,sel=null,done={};

/* ilerleme (bu cihazda) */
const key=()=>'pk-ilerleme-'+uid;
const load=()=>{try{done=JSON.parse(localStorage.getItem(key())||'{}')}catch(e){done={}}};
const save=()=>{try{localStorage.setItem(key(),JSON.stringify(done))}catch(e){}};

/* İçerik metni: her satır "Başlık | URL"; "# Bölüm adı" bölüm başlığı yapar */
function parse(txt){
  const out=[];let n=0,sec='';
  String(txt||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    if(l[0]==='#'){sec=l.replace(/^#+\s*/,'');return}
    let t='',u=l;const i=l.lastIndexOf('|');
    if(i>-1){t=l.slice(0,i).trim();u=l.slice(i+1).trim()}
    if(!/^https?:\/\//i.test(u))return;
    n++;
    const yt=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
    const tur=yt?'yt':/\.(mp4|webm|mov)(\?|$)|firebasestorage|storage\.googleapis/i.test(u)?'video':'pdf';
    out.push({id:'d'+n,t:t||'Ders '+n,u,tur,yt:yt&&yt[1],sec});
  });
  return out;
}

/* giriş */
async function girisEmail(v){
  if(v.includes('@'))return v;
  const d=await getDoc(doc(db,'usernames',v.toLowerCase()));
  if(!d.exists())throw {code:'auth/user-not-found'};
  return d.data().email;
}
$('#go').onclick=async()=>{
  const m=$('#msg');m.textContent='';
  try{await signInWithEmailAndPassword(auth,await girisEmail($('#u').value.trim()),$('#p').value)}
  catch(e){m.textContent=/network/.test(e.code||'')?'Bağlantı hatası.':'Kullanıcı adı/e-posta veya şifre hatalı.'}
};
$('#p').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
$('#out').onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
  $('#vLogin').hidden=!!u;$('#vApp').hidden=!u;
  if(!u)return;
  uid=u.uid;load();
  try{
    const ud=await getDoc(doc(db,'users',uid));
    const ad=ud.exists()?(ud.data().ad||''):'';
    $('#nm').textContent=ad?', '+ad.split(' ')[0]:'';
    const s=await getDocs(query(collection(db,'orders'),where('uid','==',uid)));
    const map={};
    s.docs.map(d=>d.data()).filter(o=>o.durum==='onaylandı').forEach(o=>(o.kalemler||[]).forEach(k=>{
      if(!map[k.id]||(!map[k.id].icerik&&k.icerik))map[k.id]=k;
    }));
    pkgs=Object.values(map).map(k=>({id:k.id,baslik:k.baslik,items:parse(k.icerik)}));
  }catch(e){pkgs=[];$('#sub').textContent='Veriler okunamadı. Sayfayı yenile.'}
  cur=pkgs[0]?.id||null;sel=null;draw();
});

const pct=p=>p.items.length?Math.round(p.items.filter(i=>done[p.id+i.id]).length/p.items.length*100):0;

function draw(){
  if(!pkgs.length){
    $('#pk').innerHTML='';$('#sub').textContent='';
    $('#body').innerHTML='<div class="empty"><p style="font-size:2.2rem">🔒</p><p style="margin:8px 0 16px">Onaylanmış bir paketin yok. Siparişin onaylanınca dersler burada açılır.</p><a class="b g" href="https://pakdil-arapca.github.io/pakdil.arapca/">Ana siteye git</a></div>';
    return;
  }
  $('#sub').textContent=pkgs.length+' paketin açık. Kaldığın yerden devam et.';
  $('#pk').innerHTML=pkgs.map(p=>`<button class="pkc" data-id="${esc(p.id)}" aria-pressed="${p.id===cur}"><strong>${esc(p.baslik)}</strong><small>${p.items.length} içerik · %${pct(p)}</small><div class="bar"><i style="width:${pct(p)}%"></i></div></button>`).join('');
  document.querySelectorAll('.pkc').forEach(b=>b.onclick=()=>{cur=b.dataset.id;sel=null;draw()});
  const p=pkgs.find(x=>x.id===cur);
  if(!p.items.length){$('#body').innerHTML='<div class="empty">Bu paketin dersleri yakında eklenecek.</div>';return}
  const it=p.items.find(x=>x.id===sel)||p.items.find(x=>!done[p.id+x.id])||p.items[0];
  sel=it.id;
  let last='';
  const list=p.items.map(x=>{
    const h=x.sec&&x.sec!==last?`<div class="sec">${esc(x.sec)}</div>`:'';last=x.sec||last;
    return h+`<button class="it ${x.id===sel?'on':''} ${done[p.id+x.id]?'done':''}" data-i="${x.id}"><div class="ic">${done[p.id+x.id]?'✓':x.tur==='pdf'?'📄':'▶'}</div><span>${esc(x.t)}<br><small>${x.tur==='pdf'?'PDF / kaynak':'Video'}</small></span></button>`;
  }).join('');
  let scr;
  if(it.tur==='yt')scr=`<div class="screen"><iframe src="https://www.youtube-nocookie.com/embed/${esc(it.yt)}?rel=0" allow="accelerometer;encrypted-media;picture-in-picture" allowfullscreen></iframe></div>`;
  else if(it.tur==='video')scr=`<div class="screen"><video controls playsinline preload="metadata" src="${esc(it.u)}"></video></div>`;
  else scr=`<div class="screen pdf"><div><div class="big">📄</div><p style="margin:10px 0 16px">${esc(it.t)}</p><a class="b g" href="${esc(it.u)}" target="_blank" rel="noopener noreferrer">PDF'i aç / indir</a></div></div>`;
  $('#body').innerHTML=`<div class="grid"><div class="stage">${scr}<div class="info"><h2>${esc(it.t)}</h2><button class="b ${done[p.id+it.id]?'':'g'}" id="dn">${done[p.id+it.id]?'Tamamlandı ✓':'Tamamlandı işaretle'}</button></div></div><div class="list">${list}</div></div>`;
  document.querySelectorAll('.it').forEach(b=>b.onclick=()=>{sel=b.dataset.i;draw()});
  $('#dn').onclick=()=>{const k=p.id+it.id;if(done[k])delete done[k];else done[k]=1;save();draw()};
}
</script>
</body>
</html>
