<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>PaKdiL AI · Eğitim Alanı</title>
<style>
:root{--bg:#0a0a0c;--s1:#131317;--s2:#1b1b21;--line:#2a2a33;--tx:#f4f1ea;--mut:#a09da8;--gold:#d4af6a;--gold2:#a9854a;--red:#c8102e}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100dvh;line-height:1.6;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 420px at 85% -5%,rgba(200,16,46,.2),transparent),repeating-linear-gradient(115deg,transparent 0 46px,rgba(212,175,106,.06) 46px 47px);-webkit-mask:linear-gradient(#000 40%,transparent);mask:linear-gradient(#000 40%,transparent)}
button,input{font:inherit}a{color:var(--gold)}[hidden]{display:none!important}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:1px solid var(--line);background:var(--s2);color:var(--tx);padding:10px 18px;border-radius:12px;cursor:pointer;text-decoration:none;font-size:.92rem;transition:.2s}
.b:hover{border-color:var(--gold);color:var(--gold)}
.b.g{background:linear-gradient(135deg,#e6c984,var(--gold2));color:#1a1306;border:0;font-weight:700}.b.g:hover{filter:brightness(1.08);color:#1a1306}
.b.wa{border-color:#25d366;color:#7ee2a0}
/* açılış / giriş */
.splash,.lg{position:relative;min-height:100dvh;display:grid;place-items:center;padding:28px 18px}
.ring{width:54px;height:54px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:sp 1s linear infinite;margin:0 auto 18px}
@keyframes sp{to{transform:rotate(360deg)}}
.splash p{color:var(--mut);text-align:center;letter-spacing:.5px}
.frame{position:relative;width:min(100%,440px);border-radius:24px;padding:2px;background:linear-gradient(145deg,rgba(212,175,106,.7),rgba(212,175,106,.12) 40%,rgba(212,175,106,.55));box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 60px rgba(212,175,106,.08)}
.frame::after{content:"";position:absolute;inset:0;border-radius:24px;padding:2.5px;background:linear-gradient(105deg,transparent 38%,#fff3c4 50%,transparent 62%) 160% 0/250% 100% no-repeat;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:shine 4.5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%{background-position:160% 0}55%,100%{background-position:-60% 0}}
.card{background:linear-gradient(180deg,#16161b,#0f0f13);border-radius:22px;padding:44px 32px 34px}
.logo{text-align:center;font-size:1.7rem;font-weight:800;letter-spacing:.5px}.logo b{color:var(--red)}
.tag{text-align:center;color:var(--gold);font-size:.72rem;letter-spacing:3px;text-transform:uppercase;margin:4px 0 6px}
.ln{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px 0 24px}
.card p.s{color:var(--mut);text-align:center;font-size:.95rem;margin-bottom:22px}
.card input{width:100%;min-height:54px;padding:14px 16px;margin-bottom:14px;background:#0a0a0d;border:1px solid var(--line);border-radius:14px;color:var(--tx);font-size:16px}
.card input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,106,.12)}
.card .b.g{width:100%;min-height:54px;font-size:1rem;margin-top:6px}
.msg{color:#ff8a9a;min-height:22px;font-size:.88rem;text-align:center;margin-top:12px}
.lk{text-align:center;color:var(--mut);font-size:.88rem;margin-top:18px}
/* uygulama */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 22px;background:rgba(10,10,12,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font-weight:800}.brand b{color:var(--red)}.brand small{display:block;color:var(--gold);font-weight:600;font-size:.66rem;letter-spacing:2px;text-transform:uppercase}
.sp{flex:1}
.wrap{position:relative;max-width:1180px;margin:0 auto;padding:40px 22px 80px}
.hero h1{font-size:clamp(1.7rem,5vw,2.6rem);line-height:1.2}.hero h1 span{color:var(--gold)}
.hero p{color:var(--mut);margin-top:8px}
.cont{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.pk{display:flex;gap:14px;overflow-x:auto;padding:26px 2px 8px;scroll-snap-type:x proximity}
.pkc{flex:none;scroll-snap-align:start;min-width:220px;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:18px 20px;color:var(--tx);cursor:pointer;transition:.2s}
.pkc[aria-pressed=true]{border-color:var(--gold);background:linear-gradient(160deg,var(--s2),var(--s1));box-shadow:0 0 0 1px var(--gold)}
.pkc strong{display:block}.pkc small{color:var(--mut)}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));transition:.4s}
.grid{display:grid;grid-template-columns:1fr 360px;gap:26px;margin-top:26px}
.stage,.list{background:var(--s1);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.screen{aspect-ratio:16/9;background:#000;display:grid;place-items:center;color:var(--mut)}
.screen iframe,.screen video{width:100%;height:100%;border:0;background:#000}
.info{padding:20px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.info h2{flex:1;font-size:1.15rem;min-width:200px}
.list{padding:10px;max-height:640px;overflow:auto}
.sec{padding:16px 12px 6px;color:var(--gold);font-size:.74rem;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.it{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:13px 12px;border-radius:14px;cursor:pointer;min-height:56px}
.it:hover{background:var(--s2)}.it.on{background:var(--s2);box-shadow:inset 3px 0 var(--red)}
.ic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line)}
.it.done .ic{background:var(--gold);color:#1a1306;border:0}
.it span{flex:1;font-size:.95rem}.it small{color:var(--mut)}
.nw{background:var(--red);color:#fff;font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:1px}
.pdf{text-align:center;padding:30px 20px}.pdf .big{font-size:3.2rem}
.empty{text-align:center;color:var(--mut);padding:70px 22px;border:1px dashed var(--line);border-radius:20px;margin-top:30px}
.help{margin-top:34px;text-align:center}
@media(max-width:860px){.grid{grid-template-columns:1fr;gap:20px}.list{max-height:none}.top{padding:12px 16px}.wrap{padding:30px 16px 70px}.card{padding:40px 24px 30px}.pkc{min-width:78%}.info .b{width:100%}.cont .b{flex:1}.top .b{padding:10px 14px}}
</style>
</head>
<body>
<div id="vSplash" class="splash"><div><div class="ring"></div><p>Giriş yapılıyor…</p></div></div>

<div id="vLogin" class="lg" hidden>
  <div class="frame"><div class="card">
    <div class="logo">PaKdiL <b>AI</b></div><div class="tag">Eğitim Alanı</div><div class="ln"></div>
    <p class="s">Ana sitedeki kullanıcı adın veya e-postanla giriş yap.</p>
    <input id="u" placeholder="Kullanıcı adı veya e-posta" autocomplete="username" autocapitalize="none" autocorrect="off">
    <input id="p" type="password" placeholder="Şifre" autocomplete="current-password">
    <button class="b g" id="go">Giriş yap</button>
    <div class="msg" id="msg"></div>
    <div class="lk">Hesabın yok mu? <a href="https://pakdil-arapca.github.io/pakdil.arapca/">Ana siteden</a> paketini al.</div>
  </div></div>
</div>

<div id="vApp" hidden>
  <header class="top">
    <div class="brand">PaKdiL <b>AI</b><small>Eğitim Alanı</small></div><div class="sp"></div>
    <a class="b" href="https://pakdil-arapca.github.io/pakdil.arapca/">Ana site</a>
    <button class="b" id="out">Çıkış</button>
  </header>
  <main class="wrap">
    <div class="hero"><h1>Hoş geldin<span id="nm"></span></h1><p id="sub"></p><div class="cont" id="cont"></div></div>
    <div class="pk" id="pk"></div>
    <div id="body"></div>
    <div class="help" id="help"></div>
  </main>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,query,where,getDocs} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCGoResXYR7G_Eleo7uAPGtwi4lfMK7j0U",authDomain:"pakdil-arapca.firebaseapp.com",projectId:"pakdil-arapca",storageBucket:"pakdil-arapca.firebasestorage.app",messagingSenderId:"742864186684",appId:"1:742864186684:web:3139c7b7219d81992b8239"});
const auth=getAuth(app),db=getFirestore(app);auth.languageCode='tr';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hs=s=>{let x=5381;for(const c of s)x=((x*33)^c.charCodeAt(0))>>>0;return x.toString(36)};
let uid='',pkgs=[],cur=null,sel=null,done=new Set(),seen=new Set(),wa='';
const kk=(p,i)=>hs(p.id+'|'+i.u);

/* ilerleme: hesapta (users/{uid}) + bu cihazda yedek */
const lsKey=()=>'pk-ilerleme2-'+uid;
function save(){
  const v={done:[...done],seen:[...seen]};
  try{localStorage.setItem(lsKey(),JSON.stringify(v))}catch(e){}
  setDoc(doc(db,'users',uid),{egitimIlerleme:v},{merge:true}).catch(()=>{});
}

function parse(txt){
  const out=[];let sec='';
  String(txt||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    if(l[0]==='#'){sec=l.replace(/^#+\s*/,'');return}
    let t='',u=l;const i=l.lastIndexOf('|');
    if(i>-1){t=l.slice(0,i).trim();u=l.slice(i+1).trim()}
    if(!/^https?:\/\//i.test(u))return;
    const n=out.length+1;
    const yt=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
    const tur=yt?'yt':/\.(mp4|webm|mov)(\?|$)|firebasestorage|storage\.googleapis/i.test(u)?'video':'pdf';
    out.push({id:'d'+n,t:t||'Ders '+n,u,tur,yt:yt&&yt[1],sec});
  });
  return out;
}

async function girisEmail(v){
  if(v.includes('@'))return v;
  const d=await getDoc(doc(db,'usernames',v.toLowerCase()));
  if(!d.exists())throw {code:'auth/user-not-found'};
  return d.data().email;
}
$('#go').onclick=async()=>{
  const m=$('#msg'),b=$('#go');m.textContent='';b.disabled=true;
  try{await signInWithEmailAndPassword(auth,await girisEmail($('#u').value.trim()),$('#p').value)}
  catch(e){m.textContent=/network/.test(e.code||'')?'Bağlantı hatası.':'Kullanıcı adı/e-posta veya şifre hatalı.';b.disabled=false}
};
$('#p').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
$('#out').onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
  $('#vSplash').hidden=true;$('#vLogin').hidden=!!u;$('#vApp').hidden=!u;
  if(!u){$('#go').disabled=false;return}
  uid=u.uid;done=new Set();seen=new Set();let first=false;
  try{
    const ud=await getDoc(doc(db,'users',uid));
    const dd=ud.exists()?ud.data():{};
    const ad=dd.ad||dd.adSoyad||'';
    $('#nm').textContent=ad?', '+String(ad).split(' ')[0]:'';
    let pr=dd.egitimIlerleme;
    if(!pr){try{pr=JSON.parse(localStorage.getItem(lsKey())||'null')}catch(e){}}
    if(pr){done=new Set(pr.done||[]);seen=new Set(pr.seen||[])}else first=true;
    const s=await getDocs(query(collection(db,'orders'),where('uid','==',uid)));
    const map={};
    s.docs.map(d=>d.data()).filter(o=>o.durum==='onaylandı').forEach(o=>(o.kalemler||[]).forEach(k=>{
      if(!map[k.id]||(!map[k.id].icerik&&k.icerik))map[k.id]=k;
    }));
    pkgs=Object.values(map).map(k=>({id:k.id,baslik:k.baslik,items:parse(k.icerik)}));
    getDoc(doc(db,'settings','payment')).then(x=>{if(x.exists()){wa=String(x.data().wa||'').replace(/\D/g,'');draw()}}).catch(()=>{});
  }catch(e){pkgs=[];$('#sub').textContent='Veriler okunamadı. Sayfayı yenile.'}
  if(first){pkgs.forEach(p=>p.items.forEach(i=>seen.add(kk(p,i))));save()}
  cur=pkgs[0]?.id||null;sel=null;draw();
});

const pct=p=>p.items.length?Math.round(p.items.filter(i=>done.has(kk(p,i))).length/p.items.length*100):0;
const go=(pid,iid)=>{cur=pid;sel=iid;draw();scrollTo({top:0,behavior:'smooth'})};

function draw(){
  $('#help').innerHTML=wa?`<a class="b wa" href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp'tan soru sor</a>`:'';
  if(!pkgs.length){
    $('#pk').innerHTML='';$('#sub').textContent='';$('#cont').innerHTML='';
    $('#body').innerHTML='<div class="empty"><p style="font-size:2.4rem">🔒</p><p style="margin:10px 0 18px">Onaylanmış bir paketin yok. Siparişin onaylanınca dersler burada açılır.</p><a class="b g" href="https://pakdil-arapca.github.io/pakdil.arapca/">Ana siteye git</a></div>';
    return;
  }
  $('#sub').textContent=pkgs.length+' paketin açık. Kaldığın yerden devam et.';
  // devam et: ilk tamamlanmamış ders
  let nx=null;for(const p of pkgs){const i=p.items.find(x=>!done.has(kk(p,x)));if(i){nx={p,i};break}}
  $('#cont').innerHTML=nx?`<button class="b g" id="cn">▶ Kaldığın yerden devam et</button>`:'';
  if(nx)$('#cn').onclick=()=>go(nx.p.id,nx.i.id);
  $('#pk').innerHTML=pkgs.map(p=>`<button class="pkc" data-id="${esc(p.id)}" aria-pressed="${p.id===cur}"><strong>${esc(p.baslik)}</strong><small>${p.items.length} içerik · %${pct(p)}</small><div class="bar"><i style="width:${pct(p)}%"></i></div></button>`).join('');
  document.querySelectorAll('.pkc').forEach(b=>b.onclick=()=>{cur=b.dataset.id;sel=null;draw()});
  const p=pkgs.find(x=>x.id===cur);
  if(!p.items.length){$('#body').innerHTML='<div class="empty">Bu paketin dersleri yakında eklenecek.</div>';return}
  const it=p.items.find(x=>x.id===sel)||p.items.find(x=>!done.has(kk(p,x)))||p.items[0];
  sel=it.id;
  if(!seen.has(kk(p,it))){seen.add(kk(p,it));save()}
  let last='';
  const list=p.items.map(x=>{
    const k=kk(p,x),h=x.sec&&x.sec!==last?`<div class="sec">${esc(x.sec)}</div>`:'';last=x.sec||last;
    const nw=!seen.has(k)&&!done.has(k)?' <span class="nw">YENİ</span>':'';
    return h+`<button class="it ${x.id===sel?'on':''} ${done.has(k)?'done':''}" data-i="${x.id}"><div class="ic">${done.has(k)?'✓':x.tur==='pdf'?'📄':'▶'}</div><span>${esc(x.t)}${nw}<br><small>${x.tur==='pdf'?'PDF / kaynak':'Video'}</small></span></button>`;
  }).join('');
  let scr;
  if(it.tur==='yt')scr=`<div class="screen"><iframe src="https://www.youtube-nocookie.com/embed/${esc(it.yt)}?rel=0&playsinline=1" allow="accelerometer;encrypted-media;picture-in-picture" allowfullscreen></iframe></div>`;
  else if(it.tur==='video')scr=`<div class="screen"><video id="vd" controls playsinline preload="metadata" src="${esc(it.u)}"></video></div>`;
  else scr=`<div class="screen pdf"><div><div class="big">📄</div><p style="margin:12px 0 18px">${esc(it.t)}</p><a class="b g" href="${esc(it.u)}" target="_blank" rel="noopener noreferrer">PDF'i aç / indir</a></div></div>`;
  const dn=done.has(kk(p,it));
  $('#body').innerHTML=`<div class="grid"><div class="stage">${scr}<div class="info"><h2>${esc(it.t)}</h2><button class="b ${dn?'':'g'}" id="dn">${dn?'Tamamlandı ✓':'Tamamlandı, sonraki ders →'}</button></div></div><div class="list">${list}</div></div>`;
  document.querySelectorAll('.it').forEach(b=>b.onclick=()=>{sel=b.dataset.i;draw()});
  const idx=p.items.indexOf(it),next=p.items[idx+1];
  const finish=()=>{done.add(kk(p,it));save();next?go(p.id,next.id):draw()};
  $('#dn').onclick=()=>{if(dn){done.delete(kk(p,it));save();draw()}else finish()};
  const vd=$('#vd');if(vd)vd.addEventListener('ended',()=>{if(!done.has(kk(p,it)))finish()});
}
</script>
</body>
</html>
